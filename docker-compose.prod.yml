#
# Production deployment stack for OpenQDA.
#
# This is different from `web/docker-compose.yml`, which is the Laravel
# Sail setup used for local development only. See docs/deployment/deployment.md.
#
# Designed to be deployed as a Portainer "Stack" from this Git repository:
# all secrets/config come from Portainer's stack "Environment variables"
# panel (paste the contents of web/docker/production/production.env.example
# there and fill in real values) rather than from a file in the repo.
#
# CLI usage is also supported:
#   cp web/docker/production/production.env.example .env
#   # edit .env with real production secrets/hostnames
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
name: openqda

services:
    app:
        build:
            context: ./web
            dockerfile: ./docker/production/Dockerfile
            args:
                WWWUSER: '${WWWUSER:-1000}'
                WWWGROUP: '${WWWGROUP:-1000}'
        image: openqda-web:${APP_VERSION:-latest}
        restart: unless-stopped
        environment:
            APP_NAME: '${APP_NAME:-OpenQDA}'
            APP_ENV: production
            APP_KEY: '${APP_KEY}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            APP_URL: '${APP_URL}'
            ASSET_URL: '${ASSET_URL:-${APP_URL}}'
            APP_LOCALE: '${APP_LOCALE:-en}'
            APP_FALLBACK_LOCALE: '${APP_FALLBACK_LOCALE:-en}'
            LOG_CHANNEL: '${LOG_CHANNEL:-stderr}'
            LOG_LEVEL: '${LOG_LEVEL:-info}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SESSION_DRIVER: '${SESSION_DRIVER:-database}'
            SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-true}'
            CACHE_DRIVER: '${CACHE_DRIVER:-redis}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
            REDIS_CLIENT: '${REDIS_CLIENT:-phpredis}'
            BROADCAST_DRIVER: '${BROADCAST_DRIVER:-reverb}'
            REVERB_APP_ID: '${REVERB_APP_ID}'
            REVERB_APP_KEY: '${REVERB_APP_KEY}'
            REVERB_APP_SECRET: '${REVERB_APP_SECRET}'
            REVERB_HOST: '${REVERB_HOST}'
            REVERB_PORT: '${REVERB_PUBLIC_PORT:-443}'
            REVERB_SCHEME: '${REVERB_SCHEME:-https}'
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080
            MAIL_MAILER: '${MAIL_MAILER:-smtp}'
            MAIL_HOST: '${MAIL_HOST}'
            MAIL_PORT: '${MAIL_PORT:-587}'
            MAIL_USERNAME: '${MAIL_USERNAME}'
            MAIL_PASSWORD: '${MAIL_PASSWORD}'
            MAIL_ENCRYPTION: '${MAIL_ENCRYPTION:-tls}'
            MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'
            MAIL_FROM_NAME: '${APP_NAME:-OpenQDA}'
            RTFENDPOINT: 'http://plugin-transform-convert-html:9666/convert'
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-true}'
        ports:
            - '${APP_PORT:-8082}:80'
            - '${REVERB_LOCAL_PORT:-8083}:8080'
        volumes:
            - app-storage:/var/www/html/storage
        networks:
            - openqda
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost/']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    mysql:
        image: 'mysql:8.0'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - openqda
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
        command: ['sh', '-c', 'redis-server --save 60 1 --requirepass "$REDIS_PASSWORD"']
        volumes:
            - redis-data:/data
        networks:
            - openqda
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping']
            interval: 10s
            timeout: 5s
            retries: 5

    plugin.transform.converthtml:
        container_name: plugin-transform-convert-html
        build:
            context: ./services/transform/convert-to-html
            dockerfile: Dockerfile
        restart: unless-stopped
        volumes:
            - transform-storage:/app/storage
        networks:
            - openqda

networks:
    openqda:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    app-storage:
        driver: local
    transform-storage:
        driver: local
